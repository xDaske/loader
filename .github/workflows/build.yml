name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build loader.exe
        shell: cmd
        run: build.bat

      - name: Check output
        shell: cmd
        run: |
          if not exist dist\loader.exe exit /b 1
          for %%A in (dist\loader.exe) do if %%~zA LSS 500000 exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: loader
          path: dist/loader.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/loader.exe
          fail_on_unmatched_files: true
